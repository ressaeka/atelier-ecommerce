services:
  postgres:
    image: postgres:16-alpine
    container_name: atelier-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: atelier-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

  backend:
    build:
      context: ./atelier-api
      dockerfile: Dockerfile

    container_name: atelier-backend
    restart: unless-stopped

    ports:
      - "4000:4000"

    env_file:
      - .env

    environment:
      NODE_ENV: ${NODE_ENV}
      HOST: ${HOST}
      PORT: ${PORT}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}

    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./atelier
      dockerfile: Dockerfile

      args:
        VITE_API_URL: ${VITE_API_URL}

    container_name: atelier-frontend
    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      - backend

volumes:
  postgres_data:
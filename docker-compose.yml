services:
  postgres:
    image: postgres:16-alpine
    container_name: atelier-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: ecommerce-api

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: atelier-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

  backend:
    build:
      context: ./atelier-api
      dockerfile: Dockerfile

    container_name: atelier-backend
    restart: unless-stopped

    ports:
      - "4000:4000"

    env_file:
      - .env

    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ecommerce-api
      REDIS_URL: redis://redis:6379

    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./atelier
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:4000

    container_name: atelier-frontend
    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      - backend

volumes:
  postgres_data: